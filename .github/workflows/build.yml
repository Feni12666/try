name: Build 10 Shahadat APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build all 10 debug APKs
        run: gradle --no-daemon assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p exported-apks
          find app/build/outputs/apk -name "*.apk" -type f -print -exec cp {} exported-apks/ \;
          ls -lh exported-apks

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Shahadat-Manage-File-10-APKs
          path: exported-apks/*.apk
          if-no-files-found: error
